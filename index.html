<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>404 - 页面不存在</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #333;
            gap: 20px;
            padding: 20px;
        }
        .title {
            font-size: 80px;
            font-weight: bold;
            color: #409eff;
        }
        .text {
            font-size: 18px;
            color: #666;
            text-align: center;
        }
        .back-btn {
            margin-top: 20px;
            padding: 12px 30px;
            border-radius: 50px;
            background: #409eff;
            color: #fff;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .back-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="title">404</div>
    <div class="text">页面不存在或已被移除</div>
    <button class="back-btn" onclick="location.href='/'">返回首页</button>
</body>
</html>
