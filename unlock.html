<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>智能开锁</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 15px;
      background: #f2f5f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .address {
      font-size: 16px;
      color: #333;
      background: #eef5ff;
      padding: 10px 20px;
      border-radius: 50px;
      margin-bottom: 10px;
    }
    .unlock-btn {
      width: 60vw;
      height: 60vw;
      max-width: 340px;
      max-height: 340px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #409eff, #2b85e7);
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 12px 35px rgba(64, 158, 255, 0.35);
      transition: all 0.25s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      user-select: none;
    }
    .unlock-btn:active {
      transform: scale(0.94);
      box-shadow: 0 6px 20px rgba(64, 158, 255, 0.2);
    }
    .unlock-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .icon {
      font-size: 60px;
    }
    .result-tip {
      padding: 12px 22px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
      min-width: 200px;
      max-width: 85%;
    }
    .tip-success {
      background: #e6ffef;
      color: #00b42a;
    }
    .tip-error {
      background: #fff1f0;
      color: #f53f3f;
    }
    .tip-loading {
      background: #f0f7ff;
      color: #409eff;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="address" id="address">🏠 加载地址中...</div>

  <button class="unlock-btn" id="unlockBtn" disabled>
    <div class="icon">🔓</div>
    <div id="btnText">初始化中...</div>
  </button>

  <div id="resultTip" class="result-tip">正在加载服务...</div>

  <script>
    // ====================== 配置 ======================
    const API_BASE = '/api';  // 根据实际部署修改，若 Worker 与 Pages 同域则保持 '/api'

    const btn = document.getElementById('unlockBtn');
    const btnText = document.getElementById('btnText');
    const resultTip = document.getElementById('resultTip');
    const addressEl = document.getElementById('address');

    // ====================== 工具函数 ======================
    function showTip(text, type) {
      resultTip.innerText = text;
      resultTip.className = 'result-tip';
      if (type) resultTip.classList.add('tip-' + type);
    }

    async function apiFetch(path, options = {}) {
      const url = API_BASE + path;
      const res = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`请求失败 (${res.status}): ${errText}`);
      }
      return res.json();
    }

    // ====================== 核心业务 ======================
    async function init() {
      try {
        showTip('正在检查登录状态...', 'loading');
        // 1. 获取当前状态（若 Token 无效，Worker 会自动刷新）
        const status = await apiFetch('/status');
        if (!status.tokenValid) {
          // 如果 Token 无效，主动调用登录接口
          showTip('正在登录...', 'loading');
          await apiFetch('/login', { method: 'POST' });
          // 重新获取状态
          const newStatus = await apiFetch('/status');
          if (!newStatus.tokenValid) {
            throw new Error('自动登录失败，请检查账号配置');
          }
          addressEl.innerText = '🏠 ' + (newStatus.buildingAddr || '未知地址');
        } else {
          addressEl.innerText = '🏠 ' + (status.buildingAddr || '未知地址');
        }

        showTip('✅ 准备就绪，点击开锁', '');
        btnText.innerText = '点击开锁';
        btn.disabled = false;
      } catch (e) {
        showTip('❌ 初始化失败：' + e.message, 'error');
        addressEl.innerText = '❌ 加载失败';
        btn.disabled = true;
        btnText.innerText = '重试';
        // 允许点击重试
        btn.onclick = () => location.reload();
      }
    }

    async function handleUnlock() {
      if (btn.disabled) return;
      btn.disabled = true;
      btnText.innerText = '处理中...';
      showTip('正在开门...', 'loading');

      try {
        // 调用开门接口（Worker 内部会自动刷新 Token）
        const result = await apiFetch('/unlock', { method: 'POST' });
        showTip('✅ ' + result.message, 'success');
        btnText.innerText = '开锁成功';
        setTimeout(() => {
          btnText.innerText = '再次开锁';
          btn.disabled = false;
        }, 2000);
      } catch (e) {
        showTip('❌ 开门失败：' + e.message, 'error');
        btnText.innerText = '重试开锁';
        btn.disabled = false;
      }
    }

    // ====================== 启动 ======================
    window.onload = init;
    btn.addEventListener('click', handleUnlock);
  </script>
</body>
</html>
