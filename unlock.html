<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>智能开锁</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f5f8;
      flex-direction: column;
      gap: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .address {
      font-size: 16px;
      color: #333;
      background: #eef5ff;
      padding: 10px 20px;
      border-radius: 50px;
      margin-bottom: 10px;
    }
    .unlock-btn {
      width: 60vw;
      height: 60vw;
      max-width: 340px;
      max-height: 340px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #409eff, #2b85e7);
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 12px 35px rgba(64, 158, 255, 0.35);
      transition: all 0.25s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      user-select: none;
    }
    .unlock-btn:active {
      transform: scale(0.94);
      box-shadow: 0 6px 20px rgba(64, 158, 255, 0.2);
    }
    .unlock-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .icon {
      font-size: 60px;
    }
    .result-tip {
      padding: 12px 22px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
      min-width: 200px;
      max-width: 85%;
    }
    .tip-success {
      background: #e6ffef;
      color: #00b42a;
    }
    .tip-error {
      background: #fff1f0;
      color: #f53f3f;
    }
    .tip-loading {
      background: #f0f7ff;
      color: #409eff;
    }
  </style>
</head>
<body>

  <div class="address" id="address">🏠 加载地址中...</div>

  <button class="unlock-btn" id="unlockBtn" disabled>
    <div class="icon">🔓</div>
    <div id="btnText">初始化中...</div>
  </button>

  <div id="resultTip" class="result-tip">正在加载服务...</div>

  <script src="SM4.js"></script>
  <script src="api.js"></script>
  <script>
    const btn = document.getElementById('unlockBtn');
    const btnText = document.getElementById('btnText');
    const resultTip = document.getElementById('resultTip');

    function showTip(text, type) {
      resultTip.innerText = text;
      resultTip.className = 'result-tip';
      if (type) resultTip.classList.add('tip-' + type);
    }

    window.onload = async () => {
      try {
        showTip('正在初始化服务...', 'loading');
        
        // ====================== 只调用一次，完成所有逻辑 ======================
        await initTokenAndInfo();

        showTip('✅ 准备就绪，点击开锁', '');
        btnText.innerText = '点击开锁';
        btn.disabled = false;
      } catch (e) {
        showTip('❌ 初始化失败：' + e.message, 'error');
        document.getElementById("address").innerText = '❌ 加载失败';
      }
    };

    btn.addEventListener('click', async () => {
      if (btn.disabled) return;
      btn.disabled = true;
      btnText.innerText = '处理中...';

      try {
        await doUnlock((msg) => {
          showTip(msg, 'loading');
        });
        showTip('✅ 开门成功！', 'success');
        btnText.innerText = '开锁成功';
        setTimeout(() => { btnText.innerText = '再次开锁'; btn.disabled = false; }, 2000);
      } catch (e) {
        showTip('❌ ' + e.message, 'error');
        btnText.innerText = '重试开锁';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
